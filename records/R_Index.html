/* 押している間は色を変えて、押したことが分かるようにする（スマホ向け） */

button:not(:disabled):active,a:active,.btn:not(:disabled):active,.att-btn:active,.p2:active,.isel-btn:active,.sq1-ud:active,.sq1-lr:active,.seg button:active,.chip button:active,[role="button"]:active{filter:var(--press);transform:scale(.96);transition-duration:0s}
.rn-item:active,.ct-row:active,.isel-opt:active{filter:var(--press);transition-duration:0s}

const $=id=>document.getElementById(id);
const BUILTIN_EV=["3x3x3 Cube", "2x2x2 Cube", "4x4x4 Cube", "5x5x5 Cube", "6x6x6 Cube", "7x7x7 Cube", "3x3x3 Blindfolded", "3x3x3 Fewest Moves", "3x3x3 One-Handed", "Clock", "Megaminx", "Pyraminx", "Skewb", "Square-1", "4x4x4 Blindfolded", "5x5x5 Blindfolded", "3x3x3 Multi-Blind", "Face Turning Octahedron"];
const EV_SHORT={'3x3x3 Cube':'3x3','2x2x2 Cube':'2x2','4x4x4 Cube':'4x4','5x5x5 Cube':'5x5','6x6x6 Cube':'6x6','7x7x7 Cube':'7x7','3x3x3 Blindfolded':'3BLD','3x3x3 Fewest Moves':'FMC','3x3x3 One-Handed':'OH','Clock':'Clock','Megaminx':'Mega','Pyraminx':'Pyra','Skewb':'Skewb','Square-1':'Sq1','4x4x4 Blindfolded':'4BLD','5x5x5 Blindfolded':'5BLD','3x3x3 Multi-Blind':'MBLD','Face Turning Octahedron':'FTO'};
// ---- 種目の設定（管理者が「種目を編集」で変更できる。未設定のときは初期の18種目） ----
let EVCFG=null,EVMAP=new Map();
const evList=()=>EVCFG||BUILTIN_EV.map(n=>({name:n,short:EV_SHORT[n]||n,scr:n}));
const evNames=()=>evList().map(e=>e.name);
function evBase(ev){const c=EVMAP.get(ev);return c?c.scr:ev}
function setEvCfg(c){EVCFG=Array.isArray(c)&&c.length?c:null;EVMAP=new Map(evList().map(e=>[e.name,e]));try{onEvCfg()}catch(e){console.error(e)}}
EVMAP=new Map(evList().map(e=>[e.name,e]));
function onEvCfg(){}
const THEME_KEY='cubelog-theme-v1';
function currentTheme(){return document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function applyTheme(t,persist){
 if(t!=='light'&&t!=='dark')return;
 document.documentElement.dataset.theme=t;
 $('themeBtn').textContent=t==='dark'?'☀':'☾';
 $('themeBtn').title=t==='dark'?'ライトモードに切り替え':'ダークモードに切り替え';
 document.querySelector('meta[name="theme-color"]').content=t==='dark'?'#0b1020':'#ffffff';
 if(persist){try{localStorage.setItem(THEME_KEY,t)}catch{}}
 try{bdgRefresh()}catch(e){}
}
{let saved=null;try{saved=localStorage.getItem(THEME_KEY)}catch{}applyTheme(saved==='light'||saved==='dark'?saved:currentTheme(),false)}
$('themeBtn').addEventListener('click',()=>applyTheme(currentTheme()==='dark'?'light':'dark',true));
const isGAS=typeof google!=='undefined'&&google.script&&google.script.run;
let curPg='main',curPlayer='',rev=null;
let records=[],names=[];
let dataLoaded=false;
const emptyRec=()=>dataLoaded?'記録はありません。':'記録を読み込み中…';
const J=JSON.stringify;
function gs(fn,...a){return new Promise((ok,ng)=>{if(!isGAS)return ng(new Error('Apps Scriptのウェブアプリとして開いてください'));google.script.run.withSuccessHandler(ok).withFailureHandler(e=>ng(new Error(e&&e.message||String(e))))[fn](...a)})}
function bar(msg,err){const b=$('syncBar');$('syncMsg').textContent=msg||'';b.style.display=msg?'block':'none';b.classList.toggle('err',!!err)}
function recalcOne(r){try{const c=calc(r.attempts,r.event,recordFormat(r));r.best=c.best;r.worst=c.worst;r.average=c.average}catch{}}
// ================= 押している間は画面を動かさない =================
// 指（マウス）を押している間と、離した直後（クリックの処理が終わるまで）は、自動の描き換えを待たせる。
// 押した瞬間に画面の高さが変わって、別のボタンが指の下に来てしまうのを防ぐ。キーボード操作のときは待たせない。
let tgPressing=false,tgQuiet=null,tgMax=null;const tgQueue=new Map();
function tgFlush(){
 if(tgPressing||tgQuiet!==null)return;
 const fs=[...tgQueue.values()];tgQueue.clear();
 for(const f of fs){try{f()}catch(e){console.error(e)}}
}
function guarded(key,fn){if(tgPressing||tgQuiet!==null)tgQueue.set(key,fn);else fn()}
function tgRelease(){tgPressing=false;clearTimeout(tgMax);clearTimeout(tgQuiet);tgQuiet=setTimeout(()=>{tgQuiet=null;tgFlush()},300)}
document.addEventListener('pointerdown',()=>{tgPressing=true;clearTimeout(tgQuiet);tgQuiet=null;clearTimeout(tgMax);tgMax=setTimeout(tgRelease,5000)},true);   // 押しっぱなしが5秒続いたら待つのをやめる
for(const t of ['pointerup','pointercancel'])document.addEventListener(t,tgRelease,true);
addEventListener('blur',tgRelease);
// 自動更新（定期的な読み込み）による描き換えだけを待たせる。操作の結果の描き換えは、すぐに行う
function paintAuto(){guarded('paint',paint)}

// ================= タップした要素を、指が触れた瞬間に確定する =================
// 指が触れてから離れるまでの間に画面がずれて、別のボタンが指の下に来ても、「触れた瞬間に指の下にあった要素」の操作として扱う。
// （触れた場所が操作できない場所で、ずれてきたボタンにクリックが届いたときは、そのクリックを無視する）
const TAP_SEL='a[href],button,input,select,textarea,label,summary,[role="button"],[tabindex]:not([tabindex="-1"]),[data-rid],[data-pick],[data-rm],.ct-row,.ct-cell,.att-btn,.rn-item,.isel-btn,.isel-opt,.bimg,.scrmini,.scr-row,.edbtn,#scrPanelImg,#mImg,#mMini';
let tapDown=null;
document.addEventListener('pointerdown',e=>{
 if(e.button>0||e.isPrimary===false){tapDown=null;return}
 tapDown={el:e.target&&e.target.closest?e.target.closest(TAP_SEL):null,x:e.clientX,y:e.clientY,t:performance.now()};
},true);
document.addEventListener('keydown',()=>{tapDown=null},true);
document.addEventListener('click',e=>{
 const d=tapDown;tapDown=null;
 if(!d||!e.isTrusted||e.detail===0)return;                    // キーボードなどによる操作・プログラムからのクリックは対象外
 if(performance.now()-d.t>1200)return;                        // 長押し
 if(Math.hypot(e.clientX-d.x,e.clientY-d.y)>20)return;        // 指が動いた（ドラッグして取り消した）場合
 if(d.el&&d.el.closest('#fmcKb'))return;                      // 押した瞬間に入力する専用キーボードは対象外
 const hit=e.target&&e.target.closest?e.target.closest(TAP_SEL):null;
 const same=(a,b)=>a===b||(a&&b&&(a.contains(b)||b.contains(a)||(a.control&&a.control===b)||(b.control&&b.control===a)));
 if(same(d.el,hit))return;
 e.preventDefault();e.stopImmediatePropagation();             // 別の要素に届いたクリックは使わない
 const o=d.el;
 if(o&&o.isConnected&&!o.disabled&&o.getClientRects().length){if(/^(INPUT|TEXTAREA)$/.test(o.tagName))o.focus();else o.click()}   // 触れた要素の操作として行う
},true);
function paint(){try{render();renderSaved();if(curPg==='player')renderPlayer()}catch(e){console.error(e)}}

async function loadAll(force){
 if(!force&&loading)return;   // 前の読み込みが終わっていなければ何もしない
 loading++;
 try{
  const first=rev===null;
  let cached=null;
  if(first){
   bar('読み込み中…');
   cached=cacheLoad();
   if(cached){try{adopt(cached.data);rev=cached.rev;unconf=true}catch{cached=null;rev=null;cacheDrop()}}
  }
  const stale=(r,full)=>rev!==null&&r<rev&&!(unconf&&full);   // サーバーの版は減らないので、小さい応答は古い応答として捨てる
  if(force||(first&&!cached)){
   const d=await gs('getAll');
   if(stale(d.rev,true)){bar('');return}
   adopt(d);rev=d.rev;unconf=false;cacheSave();
  }else{
   const c=await gs('getChanges',rev);
   if(stale(c.rev,c.full)){bar('');return}
   if(c.full){adopt(c.data);rev=c.rev;cacheSave()}
   else if(c.rev!==rev){applyChanges(c.changes||[]);rev=c.rev;cacheSave()}

}

const MN_HOOKS={detailModal:()=>closeDetail(),scrModal:()=>closeScrModal()};
// ================= 戻る操作とモーダルの連携 =================
// 画面の切り替えは URL の「#」で行っている。モーダルを開くと「#画面|m1」のように履歴を1つ積み、
// ブラウザの戻る（スマホの戻るボタン・スワイプ）で、まずモーダルだけが閉じるようにする。
const hashBase=()=>{const h=location.hash.replace(/\|m\d+$/,'');return h==='#'?'':h};
const hashDepth=()=>{const m=/\|m(\d+)$/.exec(location.hash);return m?Number(m[1]):0};
const modalStack=[];let navPending=null;
const modalShown=el=>!!el.style.display&&el.style.display!=='none';
function modalCloseTop(){
 const el=modalStack.pop();if(!el)return;
 try{const fn=MN_HOOKS[el.id];if(fn)fn()}catch(e){}   // 確認ダイアログなど、待っている処理を「キャンセル」で終わらせる
 el.style.display='none';
}
// モーダルが開いたら履歴を積み、閉じたら（画面側の操作で閉じた場合は）履歴を1つ戻す
const mnObs=new MutationObserver(list=>{
 for(const m of list){
  const el=m.target,shown=modalShown(el),i=modalStack.indexOf(el);
  if(shown&&i<0){modalStack.push(el);location.hash=hashBase()+'|m'+modalStack.length}
  else if(!shown&&i>=0){modalStack.splice(i,1);if(hashDepth()>modalStack.length)history.back()}
 }
});
document.querySelectorAll('.modal').forEach(el=>mnObs.observe(el,{attributes:true,attributeFilter:['style']}));
// 履歴とモーダルの開閉を合わせる。false を返したときは、この回の画面切り替えは行わない
function mnSync(){
 const d=hashDepth();
 while(modalStack.length>d)modalCloseTop();   // 戻る操作：上のモーダルから閉じる
 if(d>modalStack.length){                      // 「進む」などで、開いていないモーダルの履歴に来たとき
  location.replace((hashBase()||'#')+(modalStack.length?'|m'+modalStack.length:''));return false;
 }
 if(navPending!==null&&d===0){const t=navPending;navPending=null;location.hash=t}
 return true;
}
// ページ内リンク：①今いる画面へのリンクは何もしない（空の履歴を作らない） ②モーダルを開いたまま移動するときは、モーダルを閉じてから移動する
document.addEventListener('click',e=>{
 if(e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;

 const t=a.getAttribute('href'),tb=t==='#'?'':t;
 if(modalStack.length){
  e.preventDefault();e.stopPropagation();
  const n=modalStack.length;
  while(modalStack.length)modalCloseTop();
  if(tb!==hashBase())navPending=tb;
  history.go(-n);
  return;
 }
 if(tb===hashBase())e.preventDefault();
},true);

  const w=Math.min(list.offsetWidth,vw-16),h=list.scrollHeight+2,below=vh-r.bottom-10,above=r.top-10;
  const useBelow=below>=Math.min(h,260)||below>=above,room=Math.max(120,useBelow?below:above),mh=Math.min(h,room,vh*.7);
  list.style.maxHeight=mh+'px';list.style.width=w+'px';
  list.style.left=Math.max(8,Math.min(r.left,vw-w-8))+'px';
  list.style.top=(useBelow?r.bottom+4:Math.max(8,r.top-mh-4))+'px';
 };
 const mark=i=>{act=i;list.querySelectorAll('.isel-opt').forEach((e,k)=>e.classList.toggle('act',k===i));const e=list.children[i];if(e)e.scrollIntoView({block:'nearest'})};
 let at=null;
 const show=()=>{if(sel.disabled||open)return;open=true;list.hidden=false;btn.setAttribute('aria-expanded','true');place();const r=btn.getBoundingClientRect();at=[r.left,r.top];mark(sel.selectedIndex)};
 const hide=()=>{if(!open)return;open=false;list.hidden=true;btn.setAttribute('aria-expanded','false')};
 const pick=i=>{
  const o=sel.options[i];hide();if(!o||o.disabled)return;
  if(i!==sel.selectedIndex){sel.selectedIndex=i;sel.dispatchEvent(new Event('input',{bubbles:true}));sel.dispatchEvent(new Event('change',{bubbles:true}))}
  render();btn.focus();
 };
 btn.addEventListener('click',()=>open?hide():show());
 list.addEventListener('click',e=>{const o=e.target.closest('.isel-opt');if(o)pick(Number(o.dataset.i))});
 list.addEventListener('pointermove',e=>{const o=e.target.closest('.isel-opt');if(o&&Number(o.dataset.i)!==act)mark(Number(o.dataset.i))});
 btn.addEventListener('keydown',e=>{
  const n=sel.options.length;
  if(e.key==='Escape'){if(open){e.preventDefault();e.stopPropagation();hide()}return}
  if(['ArrowDown','ArrowUp','Home','End','Enter',' '].includes(e.key)){
   e.preventDefault();
   if(!open){if(e.key==='ArrowDown'||e.key==='ArrowUp'||e.key==='Enter'||e.key===' ')show();return}
   if(e.key==='Enter'||e.key===' ')pick(act);
   else mark(e.key==='Home'?0:e.key==='End'?n-1:Math.max(0,Math.min(n-1,act+(e.key==='ArrowDown'?1:-1))));
  }else if(e.key==='Tab')hide();
 });
 document.addEventListener('pointerdown',e=>{if(open&&!wrap.contains(e.target))hide()});
 window.addEventListener('resize',()=>{if(open)place()});
 window.addEventListener('scroll',e=>{if(!open||list.contains(e.target))return;const r=btn.getBoundingClientRect();if(Math.abs(r.left-at[0])>2||Math.abs(r.top-at[1])>2)hide();else place()},true);
 // 元の<select>が書き換えられたら表示を追従させる（.value の代入、選択肢の作り直し、disabled の切り替え）
 const d=Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,'value'),di=Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,'selectedIndex');
 Object.defineProperty(sel,'value',{configurable:true,get(){return d.get.call(this)},set(v){d.set.call(this,v);render()}});
 Object.defineProperty(sel,'selectedIndex',{configurable:true,get(){return di.get.call(this)},set(v){di.set.call(this,v);render()}});
 new MutationObserver(render).observe(sel,{childList:true,subtree:true,attributes:true,attributeFilter:['disabled']});
 sel.addEventListener('change',render);
 render();
}
